name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  python:
    name: Python · lint, types, tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy packages services

      - name: Tests with coverage gate
        run: pytest --cov=docentric_copilot --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Examples are reproducible
        run: python scripts/build_examples.py --check

      - name: Golden files are up to date
        run: python -m tests.golden_files.update_golden --check

      - name: Gold dataset audit trail and v0.11 baseline
        run: |
          python benchmarks/gold_audit.py --check
          python scripts/freeze_baseline.py --check

      - name: Full benchmark manifest is consistent
        run: python benchmarks/benchmark_manifest.py --check

      - name: Docs links, ADR index and wiki sidebar
        run: python scripts/check_docs_links.py

      - name: OpenAPI document is up to date
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- docs/openapi.json

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  web:
    name: Web · lint, types, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  docker:
    name: Docker · API and web images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [python, web]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: docentric-copilot-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          push: false
          tags: docentric-copilot-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security · static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
          pip install -e .

      - name: Bandit (medium+ severity)
        run: bandit -q -r packages services -x tests --severity-level medium

      - name: Dependency audit
        run: pip-audit --skip-editable --progress-spinner off
